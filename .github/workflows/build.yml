name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q jarvis.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Build APK
        run: cd jarvis-project && gradle assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis (соңғы нұсқа)
          files: jarvis-project/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
